<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="nileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#shieldGrad)" stroke="url(#nileGrad)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Shield Base -->
  <path d="M60 22 C76 22 88 28 88 42 C88 68 60 92 60 92 C60 92 32 68 32 42 C32 28 44 22 60 22 Z" 
        fill="#0f172a" stroke="url(#nileGrad)" stroke-width="2" />

  <!-- Nile River S-Curve -->
  <path d="M60 30 C68 40 50 52 64 64 C72 72 60 84 60 84" 
        fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Green Sprout / Wheat Leaves on side -->
  <path d="M60 52 C52 48 48 40 50 34 C56 36 60 44 60 52 Z" fill="#10b981" />
  <path d="M60 62 C68 58 72 50 70 44 C64 46 60 54 60 62 Z" fill="#34d399" />

  <!-- AI Constellation Nodes -->
  <circle cx="50" cy="34" r="2.5" fill="#38bdf8" />
  <circle cx="70" cy="44" r="2.5" fill="#34d399" />
  <circle cx="64" cy="64" r="2.5" fill="#38bdf8" />
  <circle cx="60" cy="84" r="3" fill="#10b981" />
</svg>
