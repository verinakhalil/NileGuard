<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <rect width="900" height="200" fill="#ce1126"/>
  <rect y="200" width="900" height="200" fill="#ffffff"/>
  <rect y="400" width="900" height="200" fill="#000000"/>
  <!-- Eagle of Saladin -->
  <g transform="translate(450, 300) scale(0.65)">
    <!-- Eagle Body Gold -->
    <path d="M-30,-70 C-30,-90 0,-100 0,-100 C0,-100 30,-90 30,-70 C35,-50 45,-20 40,20 C35,60 20,85 0,95 C-20,85 -35,60 -40,20 C-45,-20 -35,-50 -30,-70 Z" fill="#c09328" stroke="#a07518" stroke-width="3"/>
    <!-- Wings -->
    <path d="M-40,-40 C-80,-30 -110,20 -100,70 C-70,50 -50,30 -35,15 Z" fill="#c09328" stroke="#a07518" stroke-width="2"/>
    <path d="M40,-40 C80,-30 110,20 100,70 C70,50 50,30 35,15 Z" fill="#c09328" stroke="#a07518" stroke-width="2"/>
    <!-- Shield on Chest -->
    <path d="M-22,-20 L22,-20 L22,25 C22,40 0,55 0,55 C0,55 -22,40 -22,25 Z" fill="#ffffff" stroke="#c09328" stroke-width="3"/>
    <path d="M-22,-20 L-8,-20 L-8,30 C-15,25 -22,18 -22,18 Z" fill="#ce1126"/>
    <path d="M8,-20 L22,-20 L22,18 C15,25 8,30 8,30 Z" fill="#000000"/>
    <!-- Eagle Head -->
    <path d="M-15,-70 C-15,-95 0,-105 10,-105 C25,-105 30,-90 20,-80 L35,-85 L20,-75 C18,-65 0,-60 -15,-70 Z" fill="#c09328"/>
    <!-- Base Scroll -->
    <rect x="-50" y="80" width="100" height="15" rx="4" fill="#d4af37" stroke="#a07518" stroke-width="2"/>
  </g>
</svg>
