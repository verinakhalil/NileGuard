    <!-- Segment 10: Pink #DD1367 -->
    <path d="M-75,207 A220,220 0 0,1 -148,162 L-81,88 A120,120 0 0,0 -41,113 Z" fill="#DD1367"/>
    <!-- Segment 11: Amber #FD9D24 -->
    <path d="M-148,162 A220,220 0 0,1 -199,95 L-108,52 A120,120 0 0,0 -81,88 Z" fill="#FD9D24"/>
    <!-- Segment 12: Mustard #BF8B2E -->
